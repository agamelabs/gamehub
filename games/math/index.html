<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đố Toán · GameHub</title>
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="game-page">
<div class="game-topbar">
  <a class="back" href="../../">← Trang chủ</a>
  <div>
    <h1>➕ Đố Toán</h1>
    <div class="who" id="whoLabel"></div>
  </div>
  <div class="stats">
    <div class="stat">Điểm:<b id="score">0</b></div>
    <div class="stat">⏱️<b id="time">30</b></div>
    <div class="stat">🏆<b id="best">—</b></div>
  </div>
</div>

<main class="game-main">
  <div class="diff-pick" id="diffPick">
    <button data-diff="easy" class="active">Lớp 1-2</button>
    <button data-diff="med">Lớp 3-5</button>
    <button data-diff="hard">Lớp 6+</button>
  </div>
  <div class="math-card">
    <div class="math-meta"><span>Câu hỏi <b id="qn">1</b></span><span>Chuỗi đúng <b id="streak">0</b></span></div>
    <div class="math-q" id="question">…</div>
    <div class="math-options" id="options"></div>
  </div>
  <div style="margin-top:18px; display:flex; gap:10px;">
    <button class="btn" id="start">Bắt đầu</button>
  </div>
</main>

<div class="modal" id="overModal">
  <div class="box">
    <div style="font-size:48px">🎯</div>
    <h2>Hết giờ!</h2>
    <p id="overText"></p>
    <div class="actions">
      <button class="btn" id="restart">Chơi lại</button>
      <a class="btn ghost" href="../../">Về trang chủ</a>
    </div>
  </div>
</div>

<script src="../../js/sfx.js"></script>
<script src="../../js/main.js"></script>
<script>
const qEl = document.getElementById('question');
const optsEl = document.getElementById('options');
const scoreEl = document.getElementById('score');
const timeEl = document.getElementById('time');
const bestEl = document.getElementById('best');
const qnEl = document.getElementById('qn');
const streakEl = document.getElementById('streak');
const whoLabel = document.getElementById('whoLabel');
const overModal = document.getElementById('overModal');
const overText = document.getElementById('overText');

let diff = 'easy';
let score = 0, qn = 0, streak = 0, timeLeft = 30;
let timer = null, ans = 0, running = false;

function syncWho() {
  const p = window.Hub.getPlayer();
  whoLabel.textContent = p ? `${p.avatar} ${p.name}` : '';
  bestEl.textContent = window.Hub.getBest('math') ?? '—';
}

function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }

function makeQuestion() {
  let a, b, op, val;
  if (diff === 'easy') {
    op = ['+','-'][rand(0,1)];
    a = rand(1, 20); b = rand(1, 20);
    if (op === '-' && b > a) [a,b] = [b,a];
  } else if (diff === 'med') {
    op = ['+','-','×','÷'][rand(0,3)];
    if (op === '+') { a = rand(10, 99); b = rand(10, 99); }
    if (op === '-') { a = rand(20, 99); b = rand(1, a); }
    if (op === '×') { a = rand(2, 12); b = rand(2, 12); }
    if (op === '÷') { b = rand(2, 12); val = rand(2, 12); a = b * val; }
  } else {
    op = ['+','-','×','÷'][rand(0,3)];
    if (op === '+') { a = rand(50, 500); b = rand(50, 500); }
    if (op === '-') { a = rand(100, 999); b = rand(1, a); }
    if (op === '×') { a = rand(11, 25); b = rand(11, 25); }
    if (op === '÷') { b = rand(3, 15); val = rand(11, 25); a = b * val; }
  }
  switch(op) {
    case '+': val = a + b; break;
    case '-': val = a - b; break;
    case '×': val = a * b; break;
  }
  ans = val;
  qEl.textContent = `${a} ${op} ${b} = ?`;
  buildOptions(val);
}

function buildOptions(correct) {
  const set = new Set([correct]);
  while (set.size < 4) {
    const span = Math.max(5, Math.abs(correct) * 0.3);
    let w = correct + rand(-Math.ceil(span), Math.ceil(span));
    if (w !== correct && w >= 0) set.add(w);
  }
  const list = [...set].sort(()=>Math.random()-0.5);
  optsEl.innerHTML = '';
  list.forEach(v => {
    const b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', () => choose(b, v));
    optsEl.appendChild(b);
  });
}

function choose(btn, v) {
  if (!running) return;
  [...optsEl.children].forEach(c => c.disabled = true);
  if (v === ans) {
    btn.classList.add('right');
    score += 10 + streak * 2;
    streak++;
    timeLeft = Math.min(timeLeft + 1, 60);
    window.SFX && window.SFX.correct();
  } else {
    btn.classList.add('wrong');
    [...optsEl.children].forEach(c => { if (Number(c.textContent) === ans) c.classList.add('right'); });
    streak = 0;
    window.SFX && window.SFX.wrong();
  }
  scoreEl.textContent = score;
  streakEl.textContent = streak;
  setTimeout(next, 550);
}

function next() {
  qn++; qnEl.textContent = qn;
  makeQuestion();
}

function start() {
  overModal.classList.remove('open');
  window.SFX && window.SFX.start();
  score = 0; qn = 0; streak = 0; timeLeft = 30;
  scoreEl.textContent = 0; streakEl.textContent = 0; qnEl.textContent = 0; timeEl.textContent = timeLeft;
  running = true;
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  next();
}

function tick() {
  timeLeft--;
  timeEl.textContent = timeLeft;
  if (timeLeft > 0 && timeLeft <= 5 && window.SFX) window.SFX.tick();
  if (timeLeft <= 0) end();
}

function end() {
  running = false;
  clearInterval(timer);
  window.SFX && window.SFX.gameover();
  const improved = window.Hub.saveBest('math', score, 'high');
  bestEl.textContent = window.Hub.getBest('math');
  overText.textContent = `Bạn đạt ${score} điểm với ${qn} câu hỏi.` + (improved ? ' 🏆 Kỷ lục mới!' : '');
  overModal.classList.add('open');
}

document.getElementById('diffPick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#diffPick button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  diff = b.dataset.diff;
});
document.getElementById('start').addEventListener('click', start);
document.getElementById('restart').addEventListener('click', start);

syncWho();
makeQuestion();
</script>
</body>
</html>
