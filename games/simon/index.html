<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhớ Màu · GameHub</title>
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="game-page">
<div class="game-topbar">
  <a class="back" href="../../">← Trang chủ</a>
  <div>
    <h1>🎨 Nhớ Màu</h1>
    <div class="who" id="whoLabel"></div>
  </div>
  <div class="stats">
    <div class="stat">Vòng:<b id="round">0</b></div>
    <div class="stat">🏆<b id="best">—</b></div>
  </div>
</div>

<main class="game-main">
  <div class="diff-pick" id="diffPick">
    <button data-diff="easy">Dễ</button>
    <button data-diff="med" class="active">Vừa</button>
    <button data-diff="hard">Khó</button>
  </div>
  <p id="status" style="margin-top:10px; font-weight:700;">Bấm "Bắt đầu" để chơi</p>
  <div class="simon-board" id="board">
    <div class="simon-pad green" data-color="green"></div>
    <div class="simon-pad red" data-color="red"></div>
    <div class="simon-pad yellow" data-color="yellow"></div>
    <div class="simon-pad blue" data-color="blue"></div>
  </div>
  <div style="margin-top:18px; display:flex; gap:10px;">
    <button class="btn" id="start">Bắt đầu</button>
  </div>
  <p style="color:var(--ink-soft); margin-top:12px; font-size:14px;">
    Càng lên cao, chuỗi màu chạy càng nhanh. Mức <b>Khó</b> còn phải bấm thật lẹ kẻo hết giờ! ⏰
  </p>
</main>

<div class="modal" id="overModal">
  <div class="box">
    <div style="font-size:48px">🌟</div>
    <h2 id="overTitle">Hết lượt!</h2>
    <p id="overText"></p>
    <div class="actions">
      <button class="btn" id="restart">Chơi lại</button>
      <a class="btn ghost" href="../../">Về trang chủ</a>
    </div>
  </div>
</div>

<script src="../../js/sfx.js"></script>
<script src="../../js/main.js"></script>
<script>
const COLORS = ['green','red','yellow','blue'];
const FREQ = { green: 261.63, red: 329.63, yellow: 392.00, blue: 523.25 };

// Each level controls how the sequence is shown and how much time the
// player gets to answer. Playback also speeds up as the sequence grows.
const DIFFS = {
  easy: { flash: 540, gap: 240, speedup:  0, flashFloor: 420, gapFloor: 200, answerMs: 0 },
  med:  { flash: 380, gap: 150, speedup: 12, flashFloor: 230, gapFloor:  90, answerMs: 0 },
  hard: { flash: 300, gap:  90, speedup: 18, flashFloor: 150, gapFloor:  55, answerMs: 2200 },
};

const board = document.getElementById('board');
const roundEl = document.getElementById('round');
const bestEl = document.getElementById('best');
const status = document.getElementById('status');
const whoLabel = document.getElementById('whoLabel');
const overModal = document.getElementById('overModal');
const overText = document.getElementById('overText');
const overTitle = document.getElementById('overTitle');
const diffPick = document.getElementById('diffPick');

let diff = 'med';
let seq = [];
let input = [];
let playing = false;
let canTouch = false;
let audio;
let answerTimer = null;

function syncWho() {
  const p = window.Hub.getPlayer();
  whoLabel.textContent = p ? `${p.avatar} ${p.name}` : '';
  const b = window.Hub.getBest('simon');
  bestEl.textContent = b == null ? '—' : b;
}

function tone(color, dur) {
  if (window.SFX && !window.SFX.enabled) return;
  dur = dur || 0.4;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator();
    const g = audio.createGain();
    o.frequency.value = FREQ[color];
    o.type = 'sine';
    o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.001, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audio.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.start(); o.stop(audio.currentTime + dur + 0.02);
  } catch(e) {}
}

// Current playback timings — faster as the sequence gets longer.
function timings() {
  const cfg = DIFFS[diff];
  const extra = Math.max(0, seq.length - 1);
  const flashMs = Math.max(cfg.flashFloor, cfg.flash - extra * cfg.speedup);
  const gapMs = Math.max(cfg.gapFloor, cfg.gap - extra * (cfg.speedup / 2));
  return { flashMs, gapMs };
}

function flash(color) {
  const { flashMs, gapMs } = timings();
  return new Promise(res => {
    const pad = board.querySelector(`[data-color="${color}"]`);
    pad.classList.add('flash');
    tone(color, flashMs / 1000);
    setTimeout(() => { pad.classList.remove('flash'); setTimeout(res, gapMs); }, flashMs);
  });
}

function clearAnswerTimer() {
  if (answerTimer) { clearTimeout(answerTimer); answerTimer = null; }
}

// On hard mode the player must keep tapping before time runs out.
function armAnswerTimer() {
  clearAnswerTimer();
  const ms = DIFFS[diff].answerMs;
  if (!ms || !playing) return;
  answerTimer = setTimeout(() => {
    if (canTouch && playing) { status.textContent = '⏰ Chậm quá!'; gameOver(); }
  }, ms);
}

async function playSeq() {
  canTouch = false;
  clearAnswerTimer();
  status.textContent = '👀 Nhìn kỹ chuỗi màu nha...';
  for (const c of seq) {
    await flash(c);
  }
  status.textContent = '✋ Đến lượt bạn!';
  canTouch = true;
  input = [];
  armAnswerTimer();
}

function nextRound() {
  seq.push(COLORS[Math.floor(Math.random()*4)]);
  roundEl.textContent = seq.length;
  setTimeout(playSeq, 500);
}

function start() {
  overModal.classList.remove('open');
  clearAnswerTimer();
  seq = []; input = []; playing = true;
  roundEl.textContent = 0;
  diffPick.classList.add('locked');
  nextRound();
}

function gameOver() {
  playing = false; canTouch = false;
  clearAnswerTimer();
  diffPick.classList.remove('locked');
  window.SFX && window.SFX.gameover();
  const score = seq.length - 1;
  const improved = window.Hub.saveBest('simon', score, 'high');
  bestEl.textContent = window.Hub.getBest('simon');
  overTitle.textContent = score > 0 ? 'Chơi giỏi!' : 'Chưa nhớ kịp!';
  overText.textContent = `Bạn nhớ được ${score} vòng.` + (improved ? ' 🏆 Kỷ lục mới!' : '');
  overModal.classList.add('open');
}

board.addEventListener('click', (e) => {
  const pad = e.target.closest('.simon-pad');
  if (!pad || !canTouch || !playing) return;
  const c = pad.dataset.color;
  flash(c);
  input.push(c);
  const i = input.length - 1;
  if (input[i] !== seq[i]) return gameOver();
  if (input.length === seq.length) {
    canTouch = false;
    clearAnswerTimer();
    status.textContent = '👏 Tuyệt vời!';
    window.SFX && window.SFX.correct();
    setTimeout(nextRound, 800);
  } else {
    armAnswerTimer();
  }
});

diffPick.addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b || playing) return;
  document.querySelectorAll('#diffPick button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  diff = b.dataset.diff;
});

document.getElementById('start').addEventListener('click', start);
document.getElementById('restart').addEventListener('click', start);

syncWho();
</script>
</body>
</html>
