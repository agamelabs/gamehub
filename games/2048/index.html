<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2048 · GameHub</title>
<link rel="stylesheet" href="../../css/style.css" />
</head>
<body class="game-page">
<div class="game-topbar">
  <a class="back" href="../../">← Trang chủ</a>
  <div>
    <h1>🔢 2048</h1>
    <div class="who" id="whoLabel"></div>
  </div>
  <div class="stats">
    <div class="stat">Điểm:<b id="score">0</b></div>
    <div class="stat">🏆<b id="best">—</b></div>
  </div>
</div>

<main class="game-main">
  <p style="color:var(--ink-soft); margin-top:6px;">Vuốt hoặc dùng phím mũi tên để ghép các ô.</p>
  <div class="g2048-wrap" id="grid"></div>
  <div class="touch-pad" style="margin-top:14px;">
    <button class="up" data-dir="up">⬆️</button>
    <button class="left" data-dir="left">⬅️</button>
    <button class="right" data-dir="right">➡️</button>
    <button class="down" data-dir="down">⬇️</button>
  </div>
  <div style="margin-top:18px; display:flex; gap:10px;">
    <button class="btn" id="newGame">Chơi mới</button>
  </div>
</main>

<div class="modal" id="overModal">
  <div class="box">
    <div style="font-size:48px">🛑</div>
    <h2>Hết nước đi!</h2>
    <p id="overText"></p>
    <div class="actions">
      <button class="btn" id="restart">Chơi lại</button>
      <a class="btn ghost" href="../../">Về trang chủ</a>
    </div>
  </div>
</div>

<script src="../../js/main.js"></script>
<script>
const N = 4;
let grid, score;
const gridEl = document.getElementById('grid');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const whoLabel = document.getElementById('whoLabel');
const overModal = document.getElementById('overModal');
const overText = document.getElementById('overText');

function syncWho() {
  const p = window.Hub.getPlayer();
  whoLabel.textContent = p ? `${p.avatar} ${p.name}` : '';
  bestEl.textContent = window.Hub.getBest('2048') ?? '—';
}

function emptyGrid() { return Array.from({length: N}, () => Array(N).fill(0)); }

function addRandom() {
  const empty = [];
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) if (!grid[r][c]) empty.push([r,c]);
  if (!empty.length) return false;
  const [r,c] = empty[Math.floor(Math.random()*empty.length)];
  grid[r][c] = Math.random() < 0.9 ? 2 : 4;
  return true;
}

function render() {
  gridEl.innerHTML = '';
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    const v = grid[r][c];
    const div = document.createElement('div');
    div.className = 'g2048-cell';
    div.dataset.v = v || '';
    div.textContent = v || '';
    gridEl.appendChild(div);
  }
  scoreEl.textContent = score;
}

function rotate(g) {
  const r = emptyGrid();
  for (let i=0;i<N;i++) for (let j=0;j<N;j++) r[j][N-1-i] = g[i][j];
  return r;
}

function slideLeft(g) {
  let moved = false, gained = 0;
  const out = emptyGrid();
  for (let r=0;r<N;r++) {
    const row = g[r].filter(v => v);
    for (let i=0;i<row.length-1;i++) {
      if (row[i] === row[i+1]) {
        row[i] *= 2; gained += row[i]; row.splice(i+1,1);
      }
    }
    while (row.length < N) row.push(0);
    for (let c=0;c<N;c++) {
      if (g[r][c] !== row[c]) moved = true;
      out[r][c] = row[c];
    }
  }
  return { grid: out, moved, gained };
}

function move(dir) {
  let g = grid, rot = 0;
  if (dir === 'up')    rot = 1;
  if (dir === 'right') rot = 2;
  if (dir === 'down')  rot = 3;
  for (let i=0;i<rot;i++) g = rotate(g);
  const res = slideLeft(g);
  let out = res.grid;
  for (let i=0;i<(4-rot)%4;i++) out = rotate(out);
  if (res.moved) {
    grid = out;
    score += res.gained;
    addRandom();
    render();
    if (isOver()) gameOver();
  }
}

function isOver() {
  for (let r=0;r<N;r++) for (let c=0;c<N;c++) {
    if (!grid[r][c]) return false;
    if (c+1<N && grid[r][c] === grid[r][c+1]) return false;
    if (r+1<N && grid[r][c] === grid[r+1][c]) return false;
  }
  return true;
}

function gameOver() {
  const improved = window.Hub.saveBest('2048', score, 'high');
  bestEl.textContent = window.Hub.getBest('2048');
  const max = Math.max(...grid.flat());
  overText.textContent = `Ô lớn nhất ${max}, điểm ${score}.` + (improved ? ' 🏆 Kỷ lục mới!' : '');
  overModal.classList.add('open');
}

function newGame() {
  overModal.classList.remove('open');
  grid = emptyGrid(); score = 0;
  addRandom(); addRandom();
  render();
}

window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') { e.preventDefault(); move('up'); }
  else if (k === 'arrowdown' || k === 's') { e.preventDefault(); move('down'); }
  else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); move('left'); }
  else if (k === 'arrowright' || k === 'd') { e.preventDefault(); move('right'); }
});

document.querySelectorAll('.touch-pad button').forEach(b => {
  b.addEventListener('click', () => move(b.dataset.dir));
});

let touchStart = null;
gridEl.addEventListener('touchstart', (e) => { touchStart = e.touches[0]; }, { passive: true });
gridEl.addEventListener('touchend', (e) => {
  if (!touchStart) return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStart.clientX;
  const dy = t.clientY - touchStart.clientY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
  else move(dy > 0 ? 'down' : 'up');
  touchStart = null;
}, { passive: true });

document.getElementById('newGame').addEventListener('click', newGame);
document.getElementById('restart').addEventListener('click', newGame);

syncWho();
newGame();
</script>
</body>
</html>
