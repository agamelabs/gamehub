<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toán Ngón Tay · GameHub</title>
<link rel="stylesheet" href="../../css/style.css" />
<link rel="manifest" href="../../manifest.webmanifest" />
<meta name="theme-color" content="#ff6b9a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="GameHub" />
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png" />
<style>
  /* --- Finger Math game styles ------------------------------------------- */
  .fm-modes { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
  .fm-modes button {
    background: white; border: 2px solid #eef0f7; border-radius: 999px;
    padding: 8px 16px; font-family: inherit; font-size: 15px; cursor: pointer;
  }
  .fm-modes button.active { background: var(--accent-2); color: white; border-color: var(--accent-2); }

  .fm-legend {
    text-align: center; color: var(--ink-soft); font-size: 14px;
    margin: 14px auto 0; max-width: 460px; line-height: 1.6;
  }

  .fm-prompt {
    text-align: center; margin: 10px 0 4px; font-size: 20px; font-weight: 700;
    color: var(--ink);
  }
  .fm-target {
    text-align: center; font-size: 64px; font-weight: 800; line-height: 1;
    margin: 4px 0 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .fm-live { text-align: center; color: var(--ink-soft); font-size: 16px; min-height: 22px; }
  .fm-live b { color: var(--accent-2); }

  .fm-hands {
    display: flex; justify-content: center; gap: 8px; margin: 10px auto 0;
    max-width: 560px; flex-wrap: nowrap;
  }
  .fm-hand { width: 50%; max-width: 260px; }
  .fm-hand svg { width: 100%; height: auto; display: block; }
  .fm-hand-label {
    text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 2px;
  }
  .fm-hands.interactive .fm-finger { cursor: pointer; }
  .fm-hands.interactive .fm-finger:active { opacity: 0.85; }

  .fm-options {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
    max-width: 460px; margin: 16px auto 0;
  }
  .fm-options button {
    font-family: inherit; font-size: 28px; font-weight: 800; padding: 16px 0;
    border: 3px solid #eef0f7; border-radius: 16px; background: white; color: var(--ink);
    cursor: pointer; transition: transform .1s;
  }
  .fm-options button:active { transform: scale(0.96); }
  .fm-options button.right { background: #d6ffd6; border-color: var(--green); }
  .fm-options button.wrong { background: #ffe0e0; border-color: #ff8a8a; }
  .fm-options button:disabled { cursor: default; }

  .fm-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .fm-hidden { display: none !important; }

  @media (max-width: 520px) {
    .fm-target { font-size: 52px; }
    .fm-options button { font-size: 24px; padding: 14px 0; }
    .fm-hands { gap: 4px; }
  }
</style>
</head>
<body class="game-page">
<div class="game-topbar">
  <a class="back" href="../../">← Trang chủ</a>
  <div>
    <h1>✋ Toán Ngón Tay</h1>
    <div class="who" id="whoLabel"></div>
  </div>
  <div class="stats">
    <div class="stat">Điểm:<b id="score">0</b></div>
    <div class="stat">⏱️<b id="time">40</b></div>
    <div class="stat">🏆<b id="best">—</b></div>
  </div>
</div>

<main class="game-main">
  <div class="fm-modes" id="modePick">
    <button data-mode="read" class="active">👀 Đọc số</button>
    <button data-mode="make">✋ Bấm số</button>
  </div>
  <div class="diff-pick" id="diffPick">
    <button data-diff="easy" class="active">Trong 10</button>
    <button data-diff="med">Trong 20</button>
    <button data-diff="hard">Đủ 2 tay</button>
  </div>

  <div class="fm-prompt" id="prompt">Bấm “Bắt đầu” để chơi nha!</div>
  <div class="fm-target fm-hidden" id="target">0</div>

  <div class="fm-hands" id="hands">
    <div class="fm-hand">
      <div id="handLeftSvg"></div>
      <div class="fm-hand-label">Tay trái · hàng chục</div>
    </div>
    <div class="fm-hand">
      <div id="handRightSvg"></div>
      <div class="fm-hand-label">Tay phải · hàng đơn vị</div>
    </div>
  </div>

  <div class="fm-live fm-hidden" id="live"></div>

  <div class="fm-options fm-hidden" id="options"></div>

  <div class="fm-actions">
    <button class="btn" id="start">Bắt đầu</button>
    <button class="btn ghost fm-hidden" id="clear">✊ Nắm hết tay</button>
  </div>

  <div class="fm-legend">
    ✋ Mỗi ngón tay = <b>1</b> &nbsp;·&nbsp; 👍 Ngón cái = <b>5</b> &nbsp;·&nbsp;
    Tay trái là <b>hàng chục</b> (×10)
  </div>
</main>

<div class="modal" id="overModal">
  <div class="box">
    <div style="font-size:48px">🖐️</div>
    <h2>Hết giờ!</h2>
    <p id="overText"></p>
    <div class="actions">
      <button class="btn" id="restart">Chơi lại</button>
      <a class="btn ghost" href="../../">Về trang chủ</a>
    </div>
  </div>
</div>

<script src="../../js/sfx.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/pwa.js"></script>
<script>
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

// --- Finger math math ---------------------------------------------------
// Each of the 4 fingers = 1, thumb = 5. Right hand = units, left = tens.
// Canonical pattern for a single digit (0-9).
function digitPattern(d) {
  const thumb = d >= 5;
  const n = thumb ? d - 5 : d;           // how many of index..pinky are up
  return { thumb, fingers: [n > 0, n > 1, n > 2, n > 3] }; // index,middle,ring,pinky
}
// Value shown by one hand's current state.
function handValue(state) {
  return state.fingers.filter(Boolean).length + (state.thumb ? 5 : 0);
}

// --- Hand rendering -----------------------------------------------------
// Builds one SVG hand and returns { render(state), root, state }.
// side: 'right' (thumb on the left, values 1/5) or 'left' (thumb on the
// right, values 10/50). fingers order is always [index,middle,ring,pinky].
function buildHand(side, valueLabels, onToggle) {
  const root = svg('svg', { viewBox: '0 0 240 300', class: 'fm-hand-svg' });

  const mirror = side === 'left';
  // x positions for [index, middle, ring, pinky]
  const rightXs = { index: 78, middle: 112, ring: 146, pinky: 180 };
  const W = 28;
  const xs = ['index', 'middle', 'ring', 'pinky'].map((k) =>
    mirror ? 240 - rightXs[k] - W : rightXs[k]
  );
  const thumbPivot = mirror ? { x: 188, y: 214 } : { x: 52, y: 214 };
  const thumbUpAngle = mirror ? 40 : -40;
  const thumbDownAngle = mirror ? -8 : 8;

  // palm
  root.appendChild(svg('rect', { x: 36, y: 172, width: 168, height: 104, rx: 40, fill: '#f2ad78' }));

  const FINGER_BOTTOM = 208;
  const parts = { fingers: [], nails: [], labels: [] };

  // four fingers
  xs.forEach((x, i) => {
    const g = svg('g', { class: 'fm-finger' });
    g.dataset.finger = i;
    const rect = svg('rect', { x, width: W, rx: 14 });
    const nail = svg('ellipse', { cx: x + W / 2, rx: 9, ry: 11, fill: '#ffe4cf' });
    const label = svg('text', {
      x: x + W / 2, 'text-anchor': 'middle', 'font-size': 18,
      'font-weight': 700, 'font-family': 'inherit',
    });
    label.textContent = valueLabels.finger;
    g.appendChild(rect); g.appendChild(nail); g.appendChild(label);
    if (onToggle) g.addEventListener('click', () => onToggle('finger', i));
    root.appendChild(g);
    parts.fingers.push(rect); parts.nails.push(nail); parts.labels.push(label);
  });

  // thumb (rotated group)
  const thumbG = svg('g', { class: 'fm-finger' });
  thumbG.dataset.finger = 'thumb';
  const thumbRect = svg('rect', {
    x: thumbPivot.x - 15, width: 30, rx: 15,
  });
  const thumbNail = svg('ellipse', { rx: 10, ry: 12, fill: '#ffe4cf' });
  const thumbLabel = svg('text', {
    'text-anchor': 'middle', 'font-size': 18, 'font-weight': 700, 'font-family': 'inherit',
  });
  thumbLabel.textContent = valueLabels.thumb;
  thumbG.appendChild(thumbRect); thumbG.appendChild(thumbNail); thumbG.appendChild(thumbLabel);
  if (onToggle) thumbG.addEventListener('click', () => onToggle('thumb'));
  root.appendChild(thumbG);

  const UP = { fill: '#f7c08f', stroke: '#e59b66' };
  const DOWN = { fill: '#e3d0bf', stroke: '#cdb3a0' };

  function render(state) {
    // fingers
    state.fingers.forEach((up, i) => {
      const rect = parts.fingers[i];
      const top = up ? 56 : 150;
      const h = FINGER_BOTTOM - top;
      rect.setAttribute('y', top);
      rect.setAttribute('height', h);
      rect.setAttribute('fill', up ? UP.fill : DOWN.fill);
      rect.setAttribute('stroke', up ? UP.stroke : DOWN.stroke);
      rect.setAttribute('stroke-width', 3);
      const nail = parts.nails[i];
      nail.setAttribute('cy', top + 14);
      nail.style.display = up ? '' : 'none';
      const label = parts.labels[i];
      label.setAttribute('y', up ? top + 46 : top + 30);
      label.setAttribute('fill', up ? '#1f7a3d' : '#b0a79c');
      label.textContent = up ? valueLabels.finger : '';
    });
    // thumb
    const up = state.thumb;
    const len = up ? 118 : 60;
    thumbRect.setAttribute('y', thumbPivot.y - len);
    thumbRect.setAttribute('height', len);
    thumbRect.setAttribute('fill', up ? UP.fill : DOWN.fill);
    thumbRect.setAttribute('stroke', up ? UP.stroke : DOWN.stroke);
    thumbRect.setAttribute('stroke-width', 3);
    const angle = up ? thumbUpAngle : thumbDownAngle;
    const tf = `rotate(${angle} ${thumbPivot.x} ${thumbPivot.y})`;
    thumbRect.setAttribute('transform', tf);
    thumbNail.setAttribute('cx', thumbPivot.x);
    thumbNail.setAttribute('cy', thumbPivot.y - len + 14);
    thumbNail.setAttribute('transform', tf);
    thumbNail.style.display = up ? '' : 'none';
    thumbLabel.setAttribute('x', thumbPivot.x);
    thumbLabel.setAttribute('y', thumbPivot.y - len + 42);
    thumbLabel.setAttribute('transform', tf);
    thumbLabel.setAttribute('fill', up ? '#1f7a3d' : '#b0a79c');
    thumbLabel.textContent = up ? valueLabels.thumb : '';
  }

  return { root, render };
}

// --- Game state ---------------------------------------------------------
const els = {
  whoLabel: document.getElementById('whoLabel'),
  score: document.getElementById('score'),
  time: document.getElementById('time'),
  best: document.getElementById('best'),
  prompt: document.getElementById('prompt'),
  target: document.getElementById('target'),
  hands: document.getElementById('hands'),
  live: document.getElementById('live'),
  options: document.getElementById('options'),
  start: document.getElementById('start'),
  clear: document.getElementById('clear'),
  overModal: document.getElementById('overModal'),
  overText: document.getElementById('overText'),
};

// Build both hands once. Left hand (tens) uses 10/50 labels.
const rightState = { thumb: false, fingers: [false, false, false, false] };
const leftState = { thumb: false, fingers: [false, false, false, false] };

const rightHand = buildHand('right', { finger: '1', thumb: '5' }, onFingerTap.bind(null, 'right'));
const leftHand = buildHand('left', { finger: '10', thumb: '50' }, onFingerTap.bind(null, 'left'));
document.getElementById('handRightSvg').appendChild(rightHand.root);
document.getElementById('handLeftSvg').appendChild(leftHand.root);

let mode = 'read';
let diff = 'easy';
let score = 0, streak = 0, timeLeft = 40, timer = null, running = false;
let target = 0, answered = false;

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function maxForDiff() { return diff === 'easy' ? 10 : diff === 'med' ? 20 : 99; }
function startTime() { return mode === 'make' ? 50 : 40; }

function renderHands() {
  rightHand.render(rightState);
  leftHand.render(leftState);
}

function setStateFromNumber(n) {
  const units = n % 10, tens = Math.floor(n / 10);
  Object.assign(rightState, digitPattern(units));
  Object.assign(leftState, digitPattern(tens));
  renderHands();
}

function clearHands() {
  rightState.thumb = false; rightState.fingers = [false, false, false, false];
  leftState.thumb = false; leftState.fingers = [false, false, false, false];
  renderHands();
}

function currentNumber() {
  return handValue(leftState) * 10 + handValue(rightState);
}

function syncWho() {
  const p = window.Hub.getPlayer();
  els.whoLabel.textContent = p ? `${p.avatar} ${p.name}` : '';
  els.best.textContent = window.Hub.getBest('fingermath') ?? '—';
}

// --- Read mode ----------------------------------------------------------
function newReadRound() {
  answered = false;
  target = rand(1, maxForDiff());
  setStateFromNumber(target);
  els.prompt.textContent = 'Hai bàn tay đang chỉ số mấy? 🤔';
  els.target.classList.add('fm-hidden');
  buildOptions(target);
}

function buildOptions(correct) {
  const set = new Set([correct]);
  const max = maxForDiff();
  while (set.size < 4) {
    let w = correct + rand(-4, 4);
    if (w < 0) w = Math.abs(w);
    if (w > max) w = max - rand(0, 2);
    if (w !== correct && w >= 0) set.add(w);
  }
  const list = [...set].sort(() => Math.random() - 0.5);
  els.options.innerHTML = '';
  list.forEach((v) => {
    const b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', () => chooseOption(b, v));
    els.options.appendChild(b);
  });
}

function chooseOption(btn, v) {
  if (!running || answered) return;
  answered = true;
  [...els.options.children].forEach((c) => { c.disabled = true; });
  if (v === target) {
    btn.classList.add('right');
    win();
  } else {
    btn.classList.add('wrong');
    [...els.options.children].forEach((c) => {
      if (Number(c.textContent) === target) c.classList.add('right');
    });
    streak = 0;
    window.SFX && window.SFX.wrong();
  }
  setTimeout(() => { if (running) newReadRound(); }, 650);
}

// --- Make mode ----------------------------------------------------------
function newMakeRound() {
  answered = false;
  target = rand(1, maxForDiff());
  clearHands();
  els.prompt.textContent = 'Hãy bấm ngón tay để tạo số:';
  els.target.textContent = target;
  els.target.classList.remove('fm-hidden');
  updateLive();
}

function onFingerTap(hand, kind, i) {
  if (mode !== 'make' || !running || answered) return;
  const st = hand === 'right' ? rightState : leftState;
  if (kind === 'thumb') st.thumb = !st.thumb;
  else st.fingers[i] = !st.fingers[i];
  window.SFX && window.SFX.click();
  renderHands();
  updateLive();
  if (currentNumber() === target) {
    answered = true;
    win();
    setTimeout(() => { if (running) newMakeRound(); }, 750);
  }
}

function updateLive() {
  els.live.innerHTML = `Bạn đang tạo: <b>${currentNumber()}</b>`;
}

// --- Shared game flow ---------------------------------------------------
function win() {
  score += 10 + streak * 2;
  streak++;
  timeLeft = Math.min(timeLeft + 2, 90);
  els.score.textContent = score;
  window.SFX && window.SFX.correct();
}

function newRound() {
  if (mode === 'read') newReadRound(); else newMakeRound();
}

function applyModeUI() {
  const readMode = mode === 'read';
  els.options.classList.toggle('fm-hidden', !readMode);
  els.live.classList.toggle('fm-hidden', readMode);
  els.clear.classList.toggle('fm-hidden', readMode);
  els.hands.classList.toggle('interactive', !readMode);
}

function start() {
  els.overModal.classList.remove('open');
  window.SFX && window.SFX.start();
  score = 0; streak = 0; timeLeft = startTime(); running = true;
  els.score.textContent = 0; els.time.textContent = timeLeft;
  applyModeUI();
  els.start.textContent = 'Chơi lại';
  clearInterval(timer);
  timer = setInterval(tick, 1000);
  newRound();
}

function tick() {
  timeLeft--;
  els.time.textContent = timeLeft;
  if (timeLeft > 0 && timeLeft <= 5 && window.SFX) window.SFX.tick();
  if (timeLeft <= 0) end();
}

function end() {
  running = false;
  clearInterval(timer);
  window.SFX && window.SFX.gameover();
  const improved = window.Hub.saveBest('fingermath', score, 'high');
  els.best.textContent = window.Hub.getBest('fingermath');
  els.overText.textContent = `Bạn đạt ${score} điểm.` + (improved ? ' 🏆 Kỷ lục mới!' : '');
  els.overModal.classList.add('open');
}

// --- Controls -----------------------------------------------------------
document.getElementById('modePick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#modePick button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  mode = b.dataset.mode;
  if (running) start(); else { applyModeUI(); resetPreview(); }
});

document.getElementById('diffPick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#diffPick button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active');
  diff = b.dataset.diff;
  if (running) newRound();
});

els.clear.addEventListener('click', () => {
  if (mode === 'make' && running) { clearHands(); updateLive(); window.SFX && window.SFX.click(); }
});

els.start.addEventListener('click', start);
document.getElementById('restart').addEventListener('click', start);

function resetPreview() {
  els.prompt.textContent = 'Bấm “Bắt đầu” để chơi nha!';
  els.target.classList.add('fm-hidden');
  setStateFromNumber(mode === 'read' ? 7 : 0);
}

// initial preview
syncWho();
applyModeUI();
setStateFromNumber(7);
</script>
</body>
</html>
