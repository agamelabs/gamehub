<style>
  /* ===== Finger Math game ================================================ */
  .game-main { overflow: hidden; }

  /* Mode + difficulty pills */
  .fm-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .fm-pills button {
    background: white; border: 2px solid #eef0f7; border-radius: 999px;
    padding: 8px 16px; font-family: inherit; font-size: 15px; font-weight: 700;
    color: var(--ink-soft); cursor: pointer; transition: transform .12s, box-shadow .15s, background .15s;
  }
  .fm-pills button:hover { transform: translateY(-1px); }
  .fm-pills button:active { transform: scale(.95); }
  .fm-pills.modes button.active { background: var(--accent-2); color: #fff; border-color: var(--accent-2); box-shadow: 0 6px 16px rgba(78,195,255,.4); }
  .fm-pills.diffs button.active { background: var(--accent);   color: #fff; border-color: var(--accent);   box-shadow: 0 6px 16px rgba(255,107,154,.4); }

  /* Mascot + speech bubble */
  .fm-guide { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 18px auto 4px; max-width: 520px; }
  .fm-mascot {
    font-size: 46px; line-height: 1; flex: 0 0 auto;
    filter: drop-shadow(0 6px 8px rgba(31,42,68,.18));
    transition: transform .2s;
  }
  .fm-mascot.cheer { animation: mascotHop .5s ease; }
  @keyframes mascotHop { 0%,100%{transform:translateY(0) rotate(0)} 30%{transform:translateY(-14px) rotate(-8deg)} 60%{transform:translateY(-6px) rotate(6deg)} }
  .fm-mascot.oops { animation: mascotShake .4s ease; }
  @keyframes mascotShake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-9deg)} 75%{transform:rotate(9deg)} }
  .fm-bubble {
    position: relative; background: #fff; border: 3px solid #ffe1ec; border-radius: 18px;
    padding: 12px 18px; font-weight: 700; font-size: 18px; color: var(--ink);
    box-shadow: var(--shadow); max-width: 340px; min-height: 24px;
  }
  .fm-bubble::before {
    content: ''; position: absolute; left: -14px; top: 22px; width: 0; height: 0;
    border: 8px solid transparent; border-right-color: #ffe1ec;
  }
  .fm-bubble.pop { animation: bubblePop .34s cubic-bezier(.34,1.56,.64,1); }
  @keyframes bubblePop { 0%{transform:scale(.85)} 60%{transform:scale(1.05)} 100%{transform:scale(1)} }

  /* Target number (make mode) */
  .fm-target {
    text-align: center; font-size: 66px; font-weight: 900; line-height: 1; margin: 6px 0 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple), var(--accent-2));
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: hueShift 4s linear infinite;
  }
  @keyframes hueShift { to { background-position: 200% center; } }
  .fm-target.pop { animation: targetPop .4s cubic-bezier(.34,1.56,.64,1), hueShift 4s linear infinite; }
  @keyframes targetPop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }

  /* Equation (mental-math mode) */
  .fm-equation {
    text-align: center; font-size: 46px; font-weight: 900; line-height: 1.1; margin: 24px 0 10px;
    color: var(--ink); letter-spacing: 1px; white-space: nowrap;
  }
  .fm-equation .q { color: var(--accent); }
  .fm-equation.pop { animation: targetPop .4s cubic-bezier(.34,1.56,.64,1); }

  /* Streak flame */
  .fm-streak {
    text-align: center; height: 26px; font-weight: 800; color: var(--orange); font-size: 17px;
    opacity: 0; transition: opacity .2s; margin-top: 2px;
  }
  .fm-streak.show { opacity: 1; }
  .fm-streak.bump { animation: streakBump .4s ease; }
  @keyframes streakBump { 0%,100%{transform:scale(1)} 40%{transform:scale(1.35)} }

  /* Hands */
  .fm-hands {
    display: flex; justify-content: center; gap: 6px; margin: 8px auto 0; max-width: 560px;
    transition: transform .3s;
  }
  .fm-hands.cheer { animation: handsCheer .5s ease; }
  @keyframes handsCheer { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-16px)} }
  .fm-hands.shake { animation: handsShake .4s ease; }
  @keyframes handsShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)} 60%{transform:translateX(9px)} }
  .fm-hand { width: 50%; max-width: 262px; }
  .fm-hand svg { width: 100%; height: auto; display: block; overflow: visible; }
  .fm-hand-label { text-align: center; font-size: 13px; color: var(--ink-soft); margin-top: 2px; font-weight: 700; }

  /* Finger animation */
  .fm-fg { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .28s cubic-bezier(.34,1.5,.6,1); }
  .fm-finger.down .fm-fg { transform: scaleY(.30); }
  .fm-finger.down .fm-fbody { filter: grayscale(.55) brightness(.99); }
  .fm-nail { transition: opacity .2s; }
  .fm-finger.down .fm-nail { opacity: 0; }
  .fm-badge circle { transition: fill .2s; }
  .fm-badge text { transition: fill .2s; }
  .fm-finger.down .fm-badge circle, .fm-badge.down circle { fill: #e7ded2; }
  .fm-finger.down .fm-badge text,   .fm-badge.down text   { fill: #b3a99d; }
  .fm-thumb { transition: transform .3s cubic-bezier(.34,1.4,.6,1); transform: var(--tup); }
  .fm-thumb.down { transform: var(--tdn); }
  .fm-thumb.down .fm-fbody { filter: grayscale(.55); }
  .fm-thumb.down .fm-nail { opacity: 0; }
  .fm-hands.interactive .fm-finger { cursor: pointer; }
  .fm-hands.interactive .fm-finger:active .fm-fg { transform: scale(.94); }

  /* Live counter (make mode) */
  .fm-live { text-align: center; color: var(--ink-soft); font-size: 17px; min-height: 24px; font-weight: 700; margin-top: 4px; }
  .fm-live b { color: var(--accent-2); font-size: 22px; }

  /* Answer options (read mode) */
  .fm-options { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 460px; margin: 14px auto 0; }
  .fm-options button {
    font-family: inherit; font-size: 30px; font-weight: 900; padding: 18px 0;
    border: 3px solid #eef0f7; border-radius: 18px; background: #fff; color: var(--ink);
    cursor: pointer; transition: transform .1s, box-shadow .15s; box-shadow: 0 4px 0 #e6e9f2;
  }
  .fm-options button:hover { transform: translateY(-2px); }
  .fm-options button:active { transform: translateY(2px); box-shadow: 0 1px 0 #e6e9f2; }
  .fm-options button.right { background: #d8ffd8; border-color: var(--green); box-shadow: 0 4px 0 #7fd77f; animation: rightPulse .4s ease; }
  @keyframes rightPulse { 0%,100%{transform:scale(1)} 45%{transform:scale(1.1)} }
  .fm-options button.wrong { background: #ffe0e0; border-color: #ff8a8a; box-shadow: 0 4px 0 #ff8a8a; }
  .fm-options button:disabled { cursor: default; }

  .fm-actions { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .fm-actions .btn { font-size: 18px; padding: 14px 22px; }
  .fm-legend { text-align: center; color: var(--ink-soft); font-size: 14px; margin: 16px auto 0; max-width: 470px; line-height: 1.7; }
  .fm-hidden { display: none !important; }

  #score.bump { animation: streakBump .35s ease; display: inline-block; }

  /* Snappy taps on phones: no 300ms delay, no double-tap zoom, no text select */
  .fm-pills button, .fm-options button, .fm-actions .btn, .fm-hand svg { touch-action: manipulation; }
  .fm-pills button, .fm-options button, .fm-actions .btn, .fm-hand, .fm-target, .fm-live, .fm-bubble {
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }

  /* Confetti canvas overlay */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

  /* ---- Phone-first tuning (most kids play on a phone) ---- */
  @media (max-width: 560px) {
    .fm-pills { gap: 6px; margin-top: 10px; }
    .fm-pills button { padding: 9px 14px; font-size: 15px; }
    .fm-guide { margin: 12px auto 2px; gap: 8px; }
    .fm-mascot { font-size: 40px; }
    .fm-bubble { font-size: 16px; padding: 10px 14px; max-width: 62vw; }
    .fm-target { font-size: 52px; }
    .fm-equation { font-size: 40px; margin: 18px 0 8px; }
    .fm-hands { gap: 2px; }
    .fm-options { gap: 8px; }
    .fm-options button { font-size: 26px; padding: 18px 0; }
    .fm-actions { width: 100%; }
    .fm-actions .btn { flex: 1 1 44%; min-height: 54px; font-size: 18px; }
    .fm-legend { font-size: 13px; margin-top: 12px; }
  }
  @media (max-width: 380px) {
    .fm-options button { font-size: 22px; padding: 15px 0; }
    .fm-target { font-size: 46px; }
    .fm-equation { font-size: 33px; }
  }
</style>

<script>
const SVGNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const el = document.createElementNS(SVGNS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* ===== Confetti ========================================================= */
const fx = document.getElementById('fx');
const fxc = fx.getContext('2d');
let particles = [], fxRaf = null;
const CONFETTI_COLORS = ['#ff6b9a', '#4ec3ff', '#ffd54f', '#65d36e', '#a78bfa', '#ff9a5a'];
function fxResize() { fx.width = window.innerWidth; fx.height = window.innerHeight; }
fxResize(); window.addEventListener('resize', fxResize);
function confetti(x, y, count = 44) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      size: 6 + Math.random() * 7, color: CONFETTI_COLORS[(Math.random() * CONFETTI_COLORS.length) | 0],
      rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, life: 70 + (Math.random() * 30 | 0),
      round: Math.random() < 0.4,
    });
  }
  if (!fxRaf) fxRaf = requestAnimationFrame(fxLoop);
}
function fxLoop() {
  fxc.clearRect(0, 0, fx.width, fx.height);
  particles = particles.filter((p) => p.life > 0 && p.y < fx.height + 40);
  particles.forEach((p) => {
    p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.rot += p.vr; p.life--;
    fxc.save(); fxc.translate(p.x, p.y); fxc.rotate(p.rot); fxc.fillStyle = p.color;
    fxc.globalAlpha = Math.min(1, p.life / 20);
    if (p.round) { fxc.beginPath(); fxc.arc(0, 0, p.size / 2, 0, 6.28); fxc.fill(); }
    else fxc.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    fxc.restore();
  });
  if (particles.length) fxRaf = requestAnimationFrame(fxLoop);
  else { fxRaf = null; fxc.clearRect(0, 0, fx.width, fx.height); }
}
function confettiAt(el, count) {
  const r = el.getBoundingClientRect();
  confetti(r.left + r.width / 2, r.top + r.height / 2, count);
}

/* ===== Sound (real audio files) ======================================== */
const SOUNDS = {};
['tap', 'correct', 'wrong', 'start', 'win', 'lose'].forEach((n) => {
  const a = new Audio(`sounds/${n}.wav`);
  a.preload = 'auto';
  SOUNDS[n] = a;
});
function soundOn() { return !window.SFX || window.SFX.enabled; }  // obey hub mute button
function play(name, vol = 1) {
  if (!soundOn()) return;
  const base = SOUNDS[name];
  if (!base) return;
  try {
    const a = base.cloneNode(true); // clone so sounds can overlap
    a.volume = vol;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* ignore */ }
}

/* ===== Mascot ============================================================ */
const mascotEl = document.getElementById('mascot');
const bubbleEl = document.getElementById('bubble');
const PRAISE = ['Giỏi quá! 🎉', 'Chính xác! ⭐', 'Tuyệt vời! 🌟', 'Đúng rồi nè! 🎈', 'Siêu ghê! 🚀'];
const NUDGE = ['Suýt rồi, thử lại nha 💪', 'Không sao, cố lên! 🌈', 'Gần đúng rồi đó! 🙂'];
function say(text, mood) {
  bubbleEl.textContent = text;
  bubbleEl.classList.remove('pop'); void bubbleEl.offsetWidth; bubbleEl.classList.add('pop');
  if (mood) {
    mascotEl.textContent = mood === 'cheer' ? '🦊' : mood === 'oops' ? '🙀' : '🦊';
    mascotEl.classList.remove('cheer', 'oops'); void mascotEl.offsetWidth;
    if (mood === 'cheer') mascotEl.classList.add('cheer');
    if (mood === 'oops') mascotEl.classList.add('oops');
    if (mood === 'oops') setTimeout(() => { mascotEl.textContent = '🦊'; }, 900);
  }
}

/* ===== Finger math ====================================================== */
function digitPattern(d) {
  const thumb = d >= 5;
  const n = thumb ? d - 5 : d;
  return { thumb, fingers: [n > 0, n > 1, n > 2, n > 3] };
}
function handValue(state) {
  return state.fingers.filter(Boolean).length + (state.thumb ? 5 : 0);
}

/* ===== Hand rendering =================================================== */
// side: 'right' (thumb left, values 1/5) | 'left' (thumb right, values 10/50)
function buildHand(side, valueLabels, onToggle) {
  const VB = 250;
  const root = svg('svg', { viewBox: `0 0 ${VB} 300` });
  const mirror = side === 'left';
  const mx = (x) => (mirror ? VB - x : x);          // point x
  const mrx = (x, w) => (mirror ? VB - x - w : x);  // rect x

  // defs: gradients + soft shadow
  const uid = side;
  const defs = svg('defs', {});
  const skin = svg('linearGradient', { id: `skin-${uid}`, x1: 0, y1: 0, x2: 0, y2: 1 });
  skin.appendChild(svg('stop', { offset: 0, 'stop-color': '#ffd9b0' }));
  skin.appendChild(svg('stop', { offset: 1, 'stop-color': '#f3ab73' }));
  const palmG = svg('linearGradient', { id: `palm-${uid}`, x1: 0, y1: 0, x2: 0, y2: 1 });
  palmG.appendChild(svg('stop', { offset: 0, 'stop-color': '#f7b985' }));
  palmG.appendChild(svg('stop', { offset: 1, 'stop-color': '#eb9f68' }));
  const sh = svg('filter', { id: `sh-${uid}`, x: '-30%', y: '-30%', width: '160%', height: '160%' });
  sh.appendChild(svg('feDropShadow', { dx: 0, dy: 4, stdDeviation: 5, 'flood-color': '#b56b33', 'flood-opacity': .35 }));
  defs.appendChild(skin); defs.appendChild(palmG); defs.appendChild(sh);
  root.appendChild(defs);

  const hand = svg('g', { filter: `url(#sh-${uid})` });
  root.appendChild(hand);

  // palm
  hand.appendChild(svg('rect', { x: 44, y: 176, width: 170, height: 108, rx: 44, fill: `url(#palm-${uid})` }));

  const FW = 28, FTOP = 54, FBOT = 204, FH = FBOT - FTOP;
  const rightXs = { index: 84, middle: 118, ring: 152, pinky: 186 };
  const order = ['index', 'middle', 'ring', 'pinky'];
  const fingerEls = [];

  order.forEach((key, i) => {
    const rx = mrx(rightXs[key], FW), cx = rx + FW / 2;
    const g = svg('g', { class: 'fm-finger' });
    g.dataset.finger = i;
    // wide invisible tap zone so small fingers are easy to hit on phones
    g.appendChild(svg('rect', { class: 'fm-hit', x: rx - 3, y: 40, width: FW + 6, height: 210, fill: 'transparent', 'pointer-events': 'all' }));
    const anim = svg('g', { class: 'fm-fg' });
    anim.appendChild(svg('rect', { class: 'fm-fbody', x: rx, y: FTOP, width: FW, height: FH, rx: 14, fill: `url(#skin-${uid})`, stroke: '#e0975f', 'stroke-width': 2 }));
    anim.appendChild(svg('ellipse', { class: 'fm-nail', cx, cy: FTOP + 16, rx: 8.5, ry: 10.5, fill: '#ffe9d6' }));
    g.appendChild(anim);
    const badge = svg('g', { class: 'fm-badge' });
    badge.appendChild(svg('circle', { cx, cy: 232, r: 15, fill: '#c8f2cf' }));
    const t = svg('text', { x: cx, y: 238, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, 'font-family': 'inherit', fill: '#1f7a3d' });
    t.textContent = valueLabels.finger;
    badge.appendChild(t);
    g.appendChild(badge);
    if (onToggle) g.addEventListener('click', () => onToggle('finger', i));
    hand.appendChild(g);
    fingerEls.push(g);
  });

  // thumb — shorter and chunkier than the fingers, like a real thumb
  const pivotX = mx(58), pivotY = 210;
  const upAngle = mirror ? 40 : -40, downAngle = mirror ? 12 : -12;
  const TW = 32, TLEN = 88, TTOP = pivotY - TLEN; // 122..210
  const tRectX = mrx(58 - TW / 2, TW);
  const thumb = svg('g', { class: 'fm-finger fm-thumb' });
  thumb.dataset.finger = 'thumb';
  thumb.style.transformBox = 'view-box';
  thumb.style.transformOrigin = `${pivotX}px ${pivotY}px`;
  thumb.style.setProperty('--tup', `rotate(${upAngle}deg)`);
  thumb.style.setProperty('--tdn', `rotate(${downAngle}deg) scaleY(.34)`);
  thumb.appendChild(svg('rect', { class: 'fm-fbody', x: tRectX, y: TTOP, width: TW, height: TLEN, rx: 16, fill: `url(#skin-${uid})`, stroke: '#e0975f', 'stroke-width': 2 }));
  thumb.appendChild(svg('ellipse', { class: 'fm-nail', cx: pivotX, cy: TTOP + 16, rx: 9.5, ry: 11, fill: '#ffe9d6' }));
  if (onToggle) thumb.addEventListener('click', () => onToggle('thumb'));
  hand.appendChild(thumb);
  // generous, non-rotating tap zone for the thumb (mobile-friendly)
  const thit = svg('ellipse', { class: 'fm-hit', cx: mx(28), cy: 176, rx: 44, ry: 62, fill: 'transparent', 'pointer-events': 'all' });
  if (onToggle) thit.addEventListener('click', () => onToggle('thumb'));
  hand.appendChild(thit);

  // thumb value badge (fixed, readable)
  const tb = svg('g', { class: 'fm-badge fm-thumb-badge' });
  const tbx = mx(38), tby = 250;
  tb.appendChild(svg('circle', { cx: tbx, cy: tby, r: 16, fill: '#c8f2cf' }));
  const tbt = svg('text', { x: tbx, y: tby + 6, 'text-anchor': 'middle', 'font-size': 15, 'font-weight': 800, 'font-family': 'inherit', fill: '#1f7a3d' });
  tbt.textContent = valueLabels.thumb;
  tb.appendChild(tbt);
  hand.appendChild(tb);

  function render(state) {
    state.fingers.forEach((up, i) => fingerEls[i].classList.toggle('down', !up));
    thumb.classList.toggle('down', !state.thumb);
    tb.classList.toggle('down', !state.thumb);
  }
  return { root, render };
}

/* ===== Game ============================================================= */
const els = {
  whoLabel: document.getElementById('whoLabel'),
  score: document.getElementById('score'),
  time: document.getElementById('time'),
  best: document.getElementById('best'),
  target: document.getElementById('target'),
  equation: document.getElementById('equation'),
  streakEl: document.getElementById('streakEl'),
  hands: document.getElementById('hands'),
  live: document.getElementById('live'),
  options: document.getElementById('options'),
  start: document.getElementById('start'),
  clear: document.getElementById('clear'),
  overModal: document.getElementById('overModal'),
  overText: document.getElementById('overText'),
  overTitle: document.getElementById('overTitle'),
  overEmoji: document.getElementById('overEmoji'),
};

const rightState = { thumb: false, fingers: [false, false, false, false] };
const leftState = { thumb: false, fingers: [false, false, false, false] };
const rightHand = buildHand('right', { finger: '1', thumb: '5' }, onFingerTap.bind(null, 'right'));
const leftHand = buildHand('left', { finger: '10', thumb: '50' }, onFingerTap.bind(null, 'left'));
document.getElementById('handRightSvg').appendChild(rightHand.root);
document.getElementById('handLeftSvg').appendChild(leftHand.root);

let mode = 'read', diff = 'easy';
let score = 0, streak = 0, timeLeft = 40, timer = null, running = false;
let target = 0, answered = false, nextTimer = null;

// Schedule the next round, cancelling any pending one so a stale round from
// before a mode/difficulty switch can't clobber the current one.
function scheduleNext(fn, ms) {
  clearTimeout(nextTimer);
  nextTimer = setTimeout(() => { nextTimer = null; if (running) fn(); }, ms);
}

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function maxForDiff() { return diff === 'easy' ? 10 : diff === 'med' ? 20 : 99; }
function startTime() { return mode === 'make' ? 50 : 40; }

function renderHands() { rightHand.render(rightState); leftHand.render(leftState); }
function setStateFromNumber(n) {
  Object.assign(rightState, digitPattern(n % 10));
  Object.assign(leftState, digitPattern(Math.floor(n / 10)));
  renderHands();
}
function clearHands() {
  rightState.thumb = false; rightState.fingers = [false, false, false, false];
  leftState.thumb = false; leftState.fingers = [false, false, false, false];
  renderHands();
}
function currentNumber() { return handValue(leftState) * 10 + handValue(rightState); }

function bumpScore() {
  els.score.textContent = score;
  els.score.classList.remove('bump'); void els.score.offsetWidth; els.score.classList.add('bump');
}
function showStreak() {
  if (streak >= 2) {
    els.streakEl.textContent = `🔥 Chuỗi đúng: ${streak}`;
    els.streakEl.classList.add('show', 'bump');
    setTimeout(() => els.streakEl.classList.remove('bump'), 400);
  } else {
    els.streakEl.classList.remove('show');
  }
}
function cheerHands() {
  els.hands.classList.remove('cheer'); void els.hands.offsetWidth; els.hands.classList.add('cheer');
}
function shakeHands() {
  els.hands.classList.remove('shake'); void els.hands.offsetWidth; els.hands.classList.add('shake');
}

function syncWho() {
  const p = window.Hub.getPlayer();
  els.whoLabel.textContent = p ? `${p.avatar} ${p.name}` : '';
  els.best.textContent = window.Hub.getBest('fingermath') ?? '—';
}

/* --- Read mode --- */
function newReadRound() {
  answered = false;
  target = rand(1, maxForDiff());
  setStateFromNumber(target);
  say('Hai bàn tay đang chỉ số mấy? 🤔');
  els.target.classList.add('fm-hidden');
  buildOptions(target);
}
function buildOptions(correct) {
  const set = new Set([correct]), max = maxForDiff();
  while (set.size < 4) {
    let w = correct + rand(-4, 4);
    if (w < 0) w = Math.abs(w);
    if (w > max) w = max - rand(0, 2);
    if (w !== correct && w >= 0) set.add(w);
  }
  const list = [...set].sort(() => Math.random() - 0.5);
  els.options.innerHTML = '';
  list.forEach((v) => {
    const b = document.createElement('button');
    b.textContent = v;
    b.addEventListener('click', () => chooseOption(b, v));
    els.options.appendChild(b);
  });
}
function chooseOption(btn, v) {
  if (!running || answered) return;
  answered = true;
  [...els.options.children].forEach((c) => { c.disabled = true; });
  if (v === target) {
    btn.classList.add('right'); confettiAt(btn, 40); win();
  } else {
    btn.classList.add('wrong');
    [...els.options.children].forEach((c) => { if (Number(c.textContent) === target) c.classList.add('right'); });
    streak = 0; showStreak(); shakeHands();
    say(NUDGE[rand(0, NUDGE.length - 1)], 'oops');
    play('wrong');
  }
  scheduleNext(newRound, 750);  // read & mental both use options
}

/* --- Make mode --- */
function newMakeRound() {
  answered = false;
  target = rand(1, maxForDiff());
  clearHands();
  say(`Hãy bấm ngón tay để tạo số này nhé! 👇`);
  els.target.textContent = target;
  els.target.classList.remove('fm-hidden', 'pop'); void els.target.offsetWidth; els.target.classList.add('pop');
  updateLive();
}
function onFingerTap(hand, kind, i) {
  if (mode !== 'make' || !running || answered) return;
  const st = hand === 'right' ? rightState : leftState;
  if (kind === 'thumb') st.thumb = !st.thumb; else st.fingers[i] = !st.fingers[i];
  play('tap', 0.7);
  renderHands(); updateLive();
  if (currentNumber() === target) {
    answered = true; confettiAt(els.hands, 50); win();
    scheduleNext(newMakeRound, 850);
  }
}
function updateLive() { els.live.innerHTML = `Bạn đang tạo: <b>${currentNumber()}</b>`; }

/* --- Mental-math mode (no hands — practise calculating in your head) --- */
function makeMentalProblem() {
  const max = maxForDiff();
  const plus = rand(0, 1) === 1;
  let a, b, answer, op;
  if (plus) {
    op = '+';
    a = rand(1, max - 1);
    b = rand(1, max - a);   // >=1 so no trivial "+ 0"
    answer = a + b;
  } else {
    op = '−';
    a = rand(2, max);
    b = rand(1, a - 1);     // 1..a-1 so it's never "- 0" nor "a - a"
    answer = a - b;
  }
  return { a, b, op, answer };
}
function newMentalRound() {
  answered = false;
  const p = makeMentalProblem();
  target = p.answer;
  say('Tính nhẩm nhanh xem nào! 🧠');
  els.equation.innerHTML = `${p.a} ${p.op} ${p.b} = <span class="q">?</span>`;
  els.equation.classList.remove('fm-hidden', 'pop'); void els.equation.offsetWidth; els.equation.classList.add('pop');
  buildOptions(p.answer);
}

/* --- Shared --- */
function win() {
  score += 10 + streak * 2; streak++;
  timeLeft = Math.min(timeLeft + 2, 90);
  bumpScore(); showStreak(); cheerHands();
  say(PRAISE[rand(0, PRAISE.length - 1)], 'cheer');
  play('correct');
}
function newRound() {
  if (mode === 'read') newReadRound();
  else if (mode === 'make') newMakeRound();
  else newMentalRound();
}

function applyModeUI() {
  const optMode = (mode === 'read' || mode === 'mental');
  els.options.classList.toggle('fm-hidden', !optMode);
  els.live.classList.toggle('fm-hidden', mode !== 'make');
  els.clear.classList.toggle('fm-hidden', mode !== 'make');
  els.hands.classList.toggle('fm-hidden', mode === 'mental');
  els.hands.classList.toggle('interactive', mode === 'make');
  els.equation.classList.toggle('fm-hidden', mode !== 'mental');
  if (mode !== 'make') els.target.classList.add('fm-hidden');
}
function start() {
  els.overModal.classList.remove('open');
  clearTimeout(nextTimer); nextTimer = null;
  if (window.SFX && window.SFX.resume) window.SFX.resume(); // unlock audio on tap
  play('start');
  score = 0; streak = 0; timeLeft = startTime(); running = true;
  els.score.textContent = 0; els.time.textContent = timeLeft;
  els.streakEl.classList.remove('show');
  applyModeUI();
  els.start.textContent = '🔄 Chơi lại';
  clearInterval(timer); timer = setInterval(tick, 1000);
  newRound();
}
function tick() {
  timeLeft--; els.time.textContent = timeLeft;
  if (timeLeft > 0 && timeLeft <= 5 && window.SFX) window.SFX.tick();
  if (timeLeft <= 0) end();
}
function end() {
  running = false; clearInterval(timer);
  const improved = window.Hub.saveBest('fingermath', score, 'high');
  els.best.textContent = window.Hub.getBest('fingermath');
  if (improved && score > 0) {
    els.overEmoji.textContent = '🏆'; els.overTitle.textContent = 'Kỷ lục mới!';
    els.overText.textContent = `Tuyệt vời! Bạn đạt ${score} điểm.`;
    play('win');
    setTimeout(() => { confetti(window.innerWidth / 2, window.innerHeight * 0.35, 90); }, 150);
  } else {
    els.overEmoji.textContent = '🖐️'; els.overTitle.textContent = 'Hết giờ!';
    els.overText.textContent = `Bạn đạt ${score} điểm. Cố thêm lần nữa nha!`;
    play('lose');
  }
  els.overModal.classList.add('open');
}

/* --- Controls --- */
document.getElementById('modePick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#modePick button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active'); mode = b.dataset.mode;
  if (running) start(); else { applyModeUI(); resetPreview(); }
});
document.getElementById('diffPick').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#diffPick button').forEach((x) => x.classList.remove('active'));
  b.classList.add('active'); diff = b.dataset.diff;
  if (running) { clearTimeout(nextTimer); nextTimer = null; answered = false; newRound(); }
});
els.clear.addEventListener('click', () => {
  if (mode === 'make' && running) { clearHands(); updateLive(); play('tap', 0.7); }
});
els.start.addEventListener('click', start);
document.getElementById('restart').addEventListener('click', start);

function resetPreview() {
  els.target.classList.add('fm-hidden');
  els.streakEl.classList.remove('show');
  els.options.innerHTML = '';
  els.equation.classList.toggle('fm-hidden', mode !== 'mental');
  if (mode === 'read') { say('Bấm “Bắt đầu” rồi đoán số nhé! 👀'); setStateFromNumber(7); }
  else if (mode === 'make') { say('Bấm “Bắt đầu” rồi tạo số bằng ngón tay nha! ✋'); setStateFromNumber(0); }
  else { say('Bấm “Bắt đầu” rồi tính nhẩm, không dùng tay nha! 🧠'); els.equation.innerHTML = '3 + 2 = <span class="q">?</span>'; }
}

syncWho();
applyModeUI();
setStateFromNumber(7);
</script>
</body>
</html>
